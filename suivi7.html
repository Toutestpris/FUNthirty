<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FUN30</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Accès réservé : retour à l'accueil si l'étape précédente n'est pas terminée
    try {
      if ((Number(localStorage.getItem('fun30_niveau')) || 1) < 9) location.replace('index.html');
    } catch (e) { location.replace('index.html'); }
  </script>
</head>
<body data-niveau="9">

  <header class="main">
    <div class="wrap">
      <div class="logo">FUN30</div>
    </div>
  </header>

  <section class="hero">
    <div class="wrap">
      <h1>Paris</h1>
      <p>Retrouvez les lieux cachés sur la carte.</p>
    </div>
  </section>

  <main>
    <p class="compteur" id="compteur"></p>
    <div class="plan-defile">
      <div class="plan" id="plan">
        <img src="carte_paris.png" alt="Plan de Paris">
        <input class="lieu" type="text" data-lieu="0" style="left:49.40%;top:14.91%" placeholder="?" aria-label="Lieu 1">
        <input class="lieu" type="text" data-lieu="1" style="left:36.80%;top:33.90%" placeholder="?" aria-label="Lieu 2">
        <input class="lieu" type="text" data-lieu="2" style="left:45.30%;top:36.43%" placeholder="?" aria-label="Lieu 3">
        <input class="lieu" type="text" data-lieu="3" style="left:48.90%;top:47.96%" placeholder="?" aria-label="Lieu 4">
        <input class="lieu" type="text" data-lieu="4" style="left:26.20%;top:49.37%" placeholder="?" aria-label="Lieu 5">
        <input class="lieu" type="text" data-lieu="5" style="left:35.40%;top:51.90%" placeholder="?" aria-label="Lieu 6">
        <input class="lieu" type="text" data-lieu="6" style="left:57.00%;top:54.43%" placeholder="?" aria-label="Lieu 7">
        <input class="lieu" type="text" data-lieu="7" style="left:49.20%;top:58.79%" placeholder="?" aria-label="Lieu 8">
        <input class="lieu" type="text" data-lieu="8" style="left:54.30%;top:63.01%" placeholder="?" aria-label="Lieu 9">
        <input class="lieu" type="text" data-lieu="9" style="left:38.40%;top:69.62%" placeholder="?" aria-label="Lieu 10">
        <input class="lieu" type="text" data-lieu="10" style="left:63.80%;top:80.31%" placeholder="?" aria-label="Lieu 11">
        <input class="lieu" type="text" data-lieu="11" style="left:57.80%;top:45.43%" placeholder="?" aria-label="Lieu 12">
        <input class="lieu" type="text" data-lieu="12" style="left:58.30%;top:49.65%" placeholder="?" aria-label="Lieu 13">
        <input class="lieu" type="text" data-lieu="13" style="left:48.60%;top:54.15%" placeholder="?" aria-label="Lieu 14">
        <input class="lieu" type="text" data-lieu="14" style="left:68.30%;top:49.37%" placeholder="?" aria-label="Lieu 15">
      </div>
    </div>
    <div class="erreur" id="erreur" role="alert"></div>
  </main>

  <footer>© 2026 FUN30</footer>

  <!-- Photo du lieu trouvé -->
  <div class="overlay" id="lieu" hidden>
    <div class="modale" role="dialog" aria-modal="true" aria-label="Lieu trouvé">
      <button class="croix" type="button" data-fermer aria-label="Fermer">&times;</button>
      <img class="photo" id="lieu-photo" alt="Lieu trouvé">
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
