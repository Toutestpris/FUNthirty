<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FUN30</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Accès réservé : retour à l'accueil si l'énigme précédente n'est pas résolue
    try {
      if ((Number(localStorage.getItem('fun30_niveau')) || 1) < 2) location.replace('index.html');
    } catch (e) { location.replace('index.html'); }
  </script>
</head>
<body data-niveau="2">

  <header class="main">
    <div class="wrap">
      <div class="logo">FUN30</div>
    </div>
  </header>

  <section class="hero">
    <div class="wrap">
      <h1>Bienvenue place de la République</h1>
      <p>Bien joué, vous avez trouvé le lieu mystère.</p>
    </div>
  </section>

  <main>
    <div class="carte">
      <p class="compteur" id="compteur"></p>
      <img class="photo" id="photo" alt="Photo à identifier">
      <div class="invite" id="invite"></div>
      <form id="reponse" autocomplete="off" novalidate>
        <label for="champ">Nom de la rue</label>
        <div class="reponse-ligne">
          <input type="text" id="champ" name="reponse" placeholder="Votre réponse">
          <button class="btn" type="submit">Valider</button>
        </div>
        <div class="erreur" id="erreur" role="alert"></div>
      </form>
    </div>
  </main>

  <footer>© 2026 FUN30</footer>

  <script src="game.js"></script>
</body>
</html>
