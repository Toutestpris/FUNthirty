<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FUN30</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Accès réservé : retour à l'accueil si l'énigme précédente n'est pas résolue
    try {
      if ((Number(localStorage.getItem('fun30_niveau')) || 1) < 4) location.replace('index.html');
    } catch (e) { location.replace('index.html'); }
  </script>
</head>
<body data-theme="theatre" data-niveau="4">

  <header class="main">
    <div class="wrap">
      <div class="logo">FUN30</div>
    </div>
  </header>

  <section class="hero">
    <div class="wrap">
      <h1>Bienvenue au Bataclan</h1>
      <p>Bien joué, vous avez trouvé le lieu mystère.</p>
    </div>
  </section>

  <main>
    <div class="carte" id="quiz">
      <h2>Où se trouve le colis ? 😈😈</h2>
      <ul class="choix">
        <li><button class="choix-btn" type="button" data-photo="erreur1.jpg">1- Dans le Bataclan</button></li>
        <li><button class="choix-btn" type="button" data-photo="erreur2.jpg">2- Dans la foule</button></li>
        <li><button class="choix-btn" type="button" data-photo="erreur3.jpg">3- Dans la laverie en libre service juste à côté</button></li>
        <li><button class="choix-btn" type="button" data-bonne disabled>4- On sais pas BORDEL, DIT MOI OU C’EST OU JTE BUTE!!</button></li>
      </ul>
      <div class="galerie" id="galerie"></div>
    </div>
  </main>

  <footer>© 2026 FUN30</footer>

  <script src="game.js"></script>
  <script src="effets.js"></script>
</body>
</html>
