<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FUN30</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Accès réservé : retour à l'accueil si l'étape précédente n'est pas terminée
    try {
      if ((Number(localStorage.getItem('fun30_niveau')) || 1) < 7) location.replace('index.html');
    } catch (e) { location.replace('index.html'); }
  </script>
</head>
<body data-theme="route" data-niveau="7">

  <header class="main">
    <div class="wrap">
      <div class="logo">FUN30</div>
    </div>
  </header>

  <section class="hero">
    <div class="wrap">
      <h1>La pause est finie</h1>
      <p>Le trajet reprend.</p>
    </div>
  </section>

  <main>
    <div class="carte">
      <img class="photo" id="photo" alt="Rébus à résoudre" hidden>
      <div class="invite" id="invite" hidden></div>
      <form id="reponse" autocomplete="off" novalidate>
        <div class="reponse-ligne">
          <input type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" id="champ" name="reponse" placeholder="Votre réponse" aria-label="Votre réponse">
          <button class="btn" type="submit">Valider</button>
        </div>
        <div class="erreur" id="erreur" role="alert"></div>
      </form>
    </div>
  </main>

  <footer>© 2026 FUN30</footer>

  <script src="game.js"></script>
  <script src="effets.js"></script>
</body>
</html>
