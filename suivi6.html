<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FUN30</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Accès réservé : retour à l'accueil si l'étape précédente n'est pas terminée
    try {
      if ((Number(localStorage.getItem('fun30_niveau')) || 1) < 8) location.replace('index.html');
    } catch (e) { location.replace('index.html'); }
  </script>
</head>
<body data-niveau="8">

  <header class="main">
    <div class="wrap">
      <div class="logo">FUN30</div>
      <button class="btn-aide" id="btn-aide" type="button" aria-label="Aide" hidden>?</button>
    </div>
  </header>

  <section class="hero">
    <div class="wrap">
      <h1>Le belvédère</h1>
      <p>Bien joué, vous avez décrypté le rébus.</p>
    </div>
  </section>

  <main>
    <div class="carte">
      <p>« Allez au tripoint Piat-Transvaal-Envierge, vous prendrez un peu de hauteur. »</p>
      <p>« Sur place, un élément très commun du décor parisien s’y trouve. Quel nom est associé à cet objet de couleur inhabituelle ? »</p>
    </div>

    <div class="carte">
      <form id="reponse" autocomplete="off" novalidate>
        <label for="champ">Votre réponse</label>
        <div class="reponse-ligne">
          <input type="text" id="champ" name="reponse" placeholder="Votre réponse">
          <button class="btn" type="submit">Valider</button>
        </div>
        <div class="erreur" id="erreur" role="alert"></div>
      </form>
    </div>
  </main>

  <footer>© 2026 FUN30</footer>

  <!-- Aide (bouton « ? ») -->
  <div class="overlay" id="aide" hidden>
    <div class="modale" role="dialog" aria-modal="true" aria-labelledby="aide-titre">
      <button class="croix" type="button" data-fermer aria-label="Fermer">&times;</button>
      <h2 id="aide-titre">Aide</h2>
      <img class="photo" src="gromit.jpeg" alt="Gromit">
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
